name: GitHub Pages

on:
  push:
    branches: [main]
    paths: [site/**, scripts/site/**, scripts/build-site.sh, docs/PRIVACY.md, docs/SUPPORT.md, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Always runs. It builds the site and checks that the build works. It publishes nothing.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc
      - name: Build the site
        env:
          DOWNLOADS_REPO: ${{ github.repository }}
        run: scripts/build-site.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # Runs only when GitHub Pages is on (Settings > Pages > Source: GitHub Actions) and the
  # repository variable PAGES_ENABLED is true.
  deploy:
    needs: build
    if: vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
